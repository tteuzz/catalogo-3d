<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catálogo 3D · Completo</title>
<meta name="description" content="Catálogo de produtos impressos em 3D com preço de custo e preço de venda por canal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="data.js?v=12"></script>
<style>
/* Layout: vitrine de oficina — abas de catálogo no topo, grade de produtos, ficha do produto em painel sobreposto, editor e configurações como painéis */
:root{
  --bg:#EEF0EC; --surface:#FAFBF8; --ink:#1B2220; --muted:#5D6862; --line:#D5DAD3; --soft:#E2E8E2;
  --accent:#0E6E64; --accent-ink:#FFFFFF; --pei:#B27A1E;
  --good:#1F7A3D; --warn:#A86200; --bad:#B42318; --scrim:rgba(20,26,24,.45);
  --cat-red:#B8322A; --cat-green:#2E7D4F; --cat-gold:#B27A1E; --cat-blue:#3B5FA8; --cat-plum:#8A4A7A; --cat-teal:#0E6E64;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --surface:#1A201E; --ink:#E6ECE8; --muted:#97A39C; --line:#2C3531; --soft:#222A27;
  --accent:#3FB8A8; --accent-ink:#0B1412; --pei:#D9A34A; --good:#5BC27F; --warn:#E3A13B; --bad:#F2766B; --scrim:rgba(0,0,0,.6);
  --cat-red:#E5736A; --cat-green:#5BC27F; --cat-gold:#D9A34A; --cat-blue:#8A9CE6; --cat-plum:#D788B7; --cat-teal:#3FB8A8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1A201E; --ink:#E6ECE8; --muted:#97A39C; --line:#2C3531; --soft:#222A27;
  --accent:#3FB8A8; --accent-ink:#0B1412; --pei:#D9A34A; --good:#5BC27F; --warn:#E3A13B; --bad:#F2766B; --scrim:rgba(0,0,0,.6);
  --cat-red:#E5736A; --cat-green:#5BC27F; --cat-gold:#D9A34A; --cat-blue:#8A9CE6; --cat-plum:#D788B7; --cat-teal:#3FB8A8;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4vw,36px);line-height:1.05;margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent)}
h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0;letter-spacing:-.01em}
h3{font-family:var(--f-display);font-weight:600;font-size:15px;margin:0 0 8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:7px;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.plain{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.chip:focus-visible,.card:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:2px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--muted)}
.banner b{color:var(--ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip .n{font-family:var(--f-mono);font-size:12px;opacity:.7}
.newcat{display:inline-flex;gap:6px;align-items:center}
.newcat input{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);width:170px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.toolbar .left{display:flex;gap:10px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
.search{flex:1;min-width:180px;max-width:360px;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink)}
select.sel{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink)}
.catinfo{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.catinfo .hint{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;padding:0;transition:transform .12s,border-color .12s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.thumb{aspect-ratio:1/1;max-width:100%;background:var(--soft);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain}
.ph{font-family:var(--f-display);font-weight:800;font-size:40px;color:var(--muted);opacity:.55;letter-spacing:-.02em}
.badge{position:absolute;top:8px;left:8px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.badge.ex{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card-name{font-weight:600;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.card-prices{display:grid;grid-template-columns:1fr 1fr;gap:4px;border-top:1px solid var(--line);padding-top:6px}
.card-prices small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.card-prices b{font-family:var(--f-mono);font-size:13.5px;font-variant-numeric:tabular-nums}
.empty{border:2px dashed var(--line);border-radius:12px;padding:36px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:18px}

/* painéis */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(980px,100%);height:100%;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.15);display:flex;flex-direction:column}
.sheet.narrow{width:min(620px,100%)}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:calc(env(safe-area-inset-top,0px) + 12px) 12px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet-body{padding-block:18px 40px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.x{font:inherit;font-size:22px;line-height:1;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.hero{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:720px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero .thumb{border-radius:10px;border:1px solid var(--line)}
.hero-info{display:flex;flex-direction:column;gap:10px;min-width:0}
.prod-name{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3vw,30px);line-height:1.1;letter-spacing:-.015em;margin:0;text-wrap:balance}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted)}
.tag.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.tag.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.copyblock{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.copyblock .lbl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.copyblock .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.copyblock .txt.title{font-weight:600;font-size:15.5px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kv div{background:var(--soft);border-radius:8px;padding:8px 10px;min-width:0}
.kv small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv b{font-family:var(--f-mono);font-weight:600;font-size:14px;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:16px;align-items:start}
@media (max-width:1100px){.two{grid-template-columns:minmax(0,1fr)}}
.costbig{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 10px}
.costbig small{font-size:.45em;color:var(--muted);font-weight:600}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--soft);margin-bottom:10px}
.bar i{display:block;height:100%}
.rows{display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.rows div{display:flex;justify-content:space-between;gap:10px;align-items:center}
.rows span{color:var(--muted);display:flex;align-items:center;gap:7px}
.rows b{font-family:var(--f-mono);font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.rows .tot{border-top:1px solid var(--line);padding-top:5px;margin-top:3px}
.rows .tot b,.rows .tot span{font-weight:600;color:var(--ink)}
.sw{width:9px;height:9px;border-radius:2px;flex:none}
.tablewrap{overflow-x:auto}
table.prices{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
table.prices th,table.prices td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.prices th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
table.prices th:first-child,table.prices td:first-child{text-align:left;white-space:normal}
table.prices td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.prices td:first-child{font-family:var(--f-body)}
table.prices td.price{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--ink)}
table.prices .chn{font-weight:600}
table.prices .chn small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.note{font-size:12.5px;color:var(--muted)}

/* formulários */
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px 14px;text-align:center;cursor:pointer;background:var(--surface)}
.drop:hover,.drop.over,.drop:focus-visible{border-color:var(--accent);outline:none;background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.drop strong{display:block;font-family:var(--f-display);font-size:16px;font-weight:600}
.drop .fmts{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:3px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){.fields,.fields.three{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.flabel{font-size:13px;font-weight:600}
.field .note{font-size:12px}
.in{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:7px;background:var(--bg);overflow:hidden}
.in:focus-within{border-color:var(--accent)}
.in span{padding:0 9px;display:flex;align-items:center;font-size:12px;color:var(--muted);font-family:var(--f-mono);background:var(--soft);white-space:nowrap}
.in input,.in select{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);padding:8px 10px;font:inherit;font-size:14px;outline:none}
.in input[type=number]{font-family:var(--f-mono)}
textarea.ta{width:100%;min-height:150px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);padding:9px 10px;resize:vertical}
.sect{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;grid-column:1/-1;margin-top:6px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.imgpick{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.imgpick .thumb{width:110px;border-radius:8px;border:1px solid var(--line)}
.live{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.live .lv{display:flex;gap:18px;flex-wrap:wrap}
.live small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.live b{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.status{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:13.5px}
table.tiers{width:100%;border-collapse:collapse;font-size:13px}
table.tiers td,table.tiers th{padding:4px 6px;text-align:left}
table.tiers th{font-size:12px;color:var(--muted);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:50}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Catálogo <span>3D</span></h1>
    <div class="actions" id="topActions">
      <button class="btn plain" id="btnSettings" type="button">Custos e taxas</button>
      <button class="btn" id="btnNew" type="button">Novo produto</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <nav class="tabs" id="tabs" aria-label="Catálogos"></nav>

  <div class="toolbar">
    <div class="left">
      <input class="search" id="q" type="search" placeholder="Buscar produto" aria-label="Buscar produto">
      <select class="sel" id="sort" aria-label="Ordenar">
        <option value="name">Nome A–Z</option>
        <option value="profit">Maior lucro no Pix</option>
        <option value="cost">Menor custo</option>
        <option value="recent">Mais recentes</option>
      </select>
    </div>
    <div class="catinfo" id="catinfo"></div>
  </div>

  <section id="grid" class="grid" aria-live="polite"></section>
</div>

<div class="overlay" id="ovDetail" hidden><aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="dTitle" id="detail"></aside></div>
<div class="overlay" id="ovEdit" hidden><aside class="sheet narrow" role="dialog" aria-modal="true" aria-labelledby="eTitle" id="editor"></aside></div>
<div class="overlay" id="ovSettings" hidden><aside class="sheet narrow" role="dialog" aria-modal="true" aria-labelledby="sTitle" id="settings"></aside></div>

<script>
/* ================= utilidades ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL = v => (isFinite(v)?v:0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtH = min => { const m=Math.round(min||0); return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'min'; };
const num = v => { const n=parseFloat(String(v??'').replace(',','.')); return isFinite(n)?n:0; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
async function copyText(txt){ try{ await navigator.clipboard.writeText(txt); toast('Copiado'); }catch(e){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('Copiado');}catch(_){toast('Selecione e copie manualmente');} ta.remove(); } }
const CAT_COLORS = ['red','green','gold','blue','plum','teal'];
const catColor = c => 'var(--cat-'+(CAT_COLORS.includes(c)?c:'teal')+')';

/* ================= configurações padrão ================= */
const DEFAULTS = {
  filPrice:99.90, fail:8, watts:130, kwh:0.95, printerPrice:5500, lifeH:6000, maint:0.30,
  laborRate:25, laborMin:10, pack:3.00, margin:35, tax:0,
  pixFee:0, pixMargin:'', mlClassico:12, mlPremium:17, mlCustoOp:6.75, mlFrete:22,
  sh1p:20, sh1f:4, sh2p:14, sh2f:16, sh3p:14, sh3f:20, sh4p:14, sh4f:26, shCpf:false,
  tkLowP:10, tkLowF:4, tkHighP:6, tkHighF:6, tkFrete:6, tkAfil:0,
  infill:15, shell:0.9, density:1.24, speed:20, overhead:6
};
let S = {...DEFAULTS};

/* ================= custo e preço ================= */
/* filamento e tempo POR PEÇA, considerando cópias por mesa:
   em cada mesa, a parte compartilhada (preparação, descarte de cor, torre de purga) se divide entre as cópias */
const plN=(pl,mode)=> mode==='one' ? 1 : Math.max(1,Math.round(+(mode==='max'?(pl.fit||pl.copies):pl.copies)||1));
function eff(p, depth=0, mode){
  if(p.kitItems && p.kitItems.length && depth<2 && typeof products!=='undefined'){
    let g=0, m=0, found=0;
    p.kitItems.forEach(id=>{ const q=products.find(x=>x.id===id); if(q){ const e=eff(q,depth+1,mode); g+=e.g; m+=e.min; found++; } });
    if(found===p.kitItems.length) return {g, min:m, kit:true};
  }
  const pls=(p.plates||[]).filter(pl=>!pl.off);
  const sumG=pls.reduce((a,pl)=>a+(+pl.g||0),0);
  if(pls.length && Math.abs(sumG-num(p.grams))<0.6){
    let g=0, s=0;
    pls.forEach(pl=>{ const n=plN(pl,mode), sec=+pl.sec||0, gg=+pl.g||0;
      const ss=Math.min(pl.sharedSec!=null?+pl.sharedSec:300, sec), sg=Math.min(+pl.sharedG||0, gg);
      s+=(sec-ss)+ss/n; g+=(gg-sg)+sg/n; });
    return {g, min:s/60, copies:pls.map(pl=>plN(pl,mode))};
  }
  return {g:num(p.grams), min:num(p.minutes)};
}
function costOf(p, s=S, mode){
  const E = eff(p,0,mode);
  const n = (E.copies||E.kit) ? 1 : Math.max(1, Math.round(num(p.pieces)||1));
  const h = E.min/60;
  const fil = E.g/1000*num(p.filPrice||s.filPrice);
  const en  = h*num(s.watts)/1000*num(s.kwh);
  const dep = h*(num(s.printerPrice)/Math.max(1,num(s.lifeH)) + num(s.maint));
  const fail= (fil+en+dep)*num(s.fail)/100;
  const laborMin = p.laborMin===''||p.laborMin==null ? num(s.laborMin) : num(p.laborMin);

function channels(s=S){
  const P=v=>num(v)/100, cpf = s.shCpf ? 3 : 0;
  const ml = pct => [{min:0,max:79,pct:P(pct),fix:num(s.mlCustoOp),fl:'Custo por unidade'},{min:79,max:Infinity,pct:P(pct),fix:num(s.mlFrete),fl:'Frete grátis (você paga)'}];
  return [
    {key:'pix', name:'Venda direta', sub:'Pix, WhatsApp, Instagram', tiers:[{min:0,max:Infinity,pct:P(s.pixFee),fix:0,fl:''}], extra:0, margin: s.pixMargin===''||s.pixMargin==null ? null : P(s.pixMargin)},
    {key:'ml1', name:'Mercado Livre', sub:'Anúncio Clássico', tiers:ml(s.mlClassico), extra:0},
    {key:'ml2', name:'Mercado Livre', sub:'Anúncio Premium', tiers:ml(s.mlPremium), extra:0},
    {key:'sh', name:'Shopee', sub:'Comissão + tarifa por item'+(cpf?' + CPF':''), tiers:[
      {min:0,max:80,pct:P(s.sh1p),fix:num(s.sh1f)+cpf,fl:'Tarifa fixa'},{min:80,max:100,pct:P(s.sh2p),fix:num(s.sh2f)+cpf,fl:'Tarifa fixa'},
      {min:100,max:200,pct:P(s.sh3p),fix:num(s.sh3f)+cpf,fl:'Tarifa fixa'},{min:200,max:Infinity,pct:P(s.sh4p),fix:num(s.sh4f)+cpf,fl:'Tarifa fixa'}], extra:0},
    {key:'tk', name:'TikTok Shop', sub:'Comissão'+(num(s.tkFrete)?' + frete':'')+(num(s.tkAfil)?' + afiliados':''), tiers:[
      {min:0,max:50,pct:P(s.tkLowP),fix:num(s.tkLowF),fl:'Tarifa fixa'},{min:50,max:Infinity,pct:P(s.tkHighP),fix:num(s.tkHighF),fl:'Tarifa fixa'}], extra:P(num(s.tkFrete)+num(s.tkAfil))},
  ];

function solve(cost, tiers, extra, margin, tax){
  const c=[]; for(const t of tiers){ const den=1-t.pct-extra-tax-margin; if(den<=0.01) continue; const p=(cost+t.fix)/den; if(p>=t.min&&p<t.max) c.push(p); else if(p<t.min) c.push(t.min); }
  return c.length?Math.min(...c):NaN;
}
const tierAt = (p,tiers) => tiers.find(t=>p>=t.min&&p<t.max) || tiers[tiers.length-1];
const round90 = p => Math.ceil(p+0.10)-0.10;
function pricesFor(p, s=S){
  const cost = costOf(p,s).total, tax=num(s.tax)/100;
  const baseMargin = p.margin===''||p.margin==null ? num(s.margin)/100 : num(p.margin)/100;
  return channels(s).map(ch=>{
    const m = ch.margin!=null && (p.margin===''||p.margin==null) ? ch.margin : baseMargin;
    const exact = solve(cost, ch.tiers, ch.extra, m, tax);
    if(!isFinite(exact)) return {ch, bad:true};
    const price = round90(exact), t = tierAt(price,ch.tiers);
    const pct = price*(t.pct+ch.extra), fix=t.fix, taxV=price*tax, net=price-pct-fix-taxV, profit=net-cost;
    return {ch, price, t, pct, fix, taxV, net, profit, real:profit/price, m, minP: round90(solve(cost,ch.tiers,ch.extra,0,tax))};
  });
}

function parseSTL(buf){
  const dv=new DataView(buf);
  if(buf.byteLength>=84 && 84+dv.getUint32(80,true)*50===buf.byteLength){ const n=dv.getUint32(80,true), out=new Float32Array(n*9); for(let i=0;i<n;i++){ const o=84+i*50+12; for(let k=0;k<9;k++) out[i*9+k]=dv.getFloat32(o+k*4,true);} return out; }

}
function meshStats(arrs){
  let vol=0, area=0; const mn=[Infinity,Infinity,Infinity], mx=[-Infinity,-Infinity,-Infinity];
  for(const a of arrs) for(let i=0;i+8<a.length;i+=9){
    const ax=a[i],ay=a[i+1],az=a[i+2],bx=a[i+3],by=a[i+4],bz=a[i+5],cx=a[i+6],cy=a[i+7],cz=a[i+8];
    vol+=(ax*(by*cz-bz*cy)-ay*(bx*cz-bz*cx)+az*(bx*cy-by*cx))/6;
    const ux=bx-ax,uy=by-ay,uz=bz-az,vx=cx-ax,vy=cy-ay,vz=cz-az, nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx; area+=Math.sqrt(nx*nx+ny*ny+nz*nz)/2;
    for(const [x,y,z] of [[ax,ay,az],[bx,by,bz],[cx,cy,cz]]){ if(x<mn[0])mn[0]=x; if(y<mn[1])mn[1]=y; if(z<mn[2])mn[2]=z; if(x>mx[0])mx[0]=x; if(y>mx[1])mx[1]=y; if(z>mx[2])mx[2]=z; }
  }
  return {volume:Math.abs(vol), area, bbox:[mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2]]};
}
const attr=(s,k)=>{ const m=s.match(new RegExp('(?:^|\\s)'+k+'="([^"]*)"')); return m?m[1]:'0'; };
function parse3mfMeshes(xml){
  const out=[]; for(const ch of xml.split(/<(?:\w+:)?mesh[\s>]/).slice(1)){
    const vs=[], tri=[]; let m; const vre=/<(?:\w+:)?vertex\s+([^>]*?)\/?>/g; while((m=vre.exec(ch))){ vs.push(+attr(m[1],'x'),+attr(m[1],'y'),+attr(m[1],'z')); }
    const tre=/<(?:\w+:)?triangle\s+([^>]*?)\/?>/g; while((m=tre.exec(ch))){ for(const k of ['v1','v2','v3']){ const j=+attr(m[1],k)*3; tri.push(vs[j],vs[j+1],vs[j+2]); } }
    if(tri.length) out.push(new Float32Array(tri));
  } return out;
}
function parseDuration(s){ if(!s) return 0; s=s.trim(); if(/^\d+(\.\d+)?$/.test(s)) return +s; let t=0,m; const re=/(\d+(?:\.\d+)?)\s*([dhms])/g; while((m=re.exec(s))) t+=+m[1]*({d:86400,h:3600,m:60,s:1}[m[2]]); return t; }
function parseGcode(text){

async function readModelFile(file){
  const lower=file.name.toLowerCase(); const r={fileName:file.name, name:prettyName(file.name)};
  if(lower.endsWith('.stl')){
    const arr=parseSTL(await file.arrayBuffer()); if(!arr.length) throw new Error('Não encontrei a peça dentro deste STL.');

  }
  if(lower.endsWith('.gcode')||lower.endsWith('.gco')){
    const t = file.size>800000 ? (await file.slice(0,400000).text())+'\n'+(await file.slice(file.size-400000).text()) : await file.text();
    const g=parseGcode(t); if(!g.sec&&!g.g) throw new Error('Este G-code não tem tempo e peso do fatiador.'); Object.assign(r,{grams:+g.g.toFixed(1), minutes:Math.round(g.sec/60), kind:'exact'}); return r;
  }
  if(!lower.endsWith('.3mf')) throw new Error('Use um arquivo .3mf, .stl ou .gcode.');
  if(typeof JSZip==='undefined') throw new Error('O leitor de 3MF não carregou. Recarregue a página.');
  const zip=await JSZip.loadAsync(file); const names=Object.keys(zip.files);
  // dados do modelo (MakerWorld / Bambu Studio)
  const mainName = names.find(n=>/^3D\/3dmodel\.model$/i.test(n));
  if(mainName){ const head=(await zip.file(mainName).async('string')).slice(0,60000);
    const title=metaVal(head,'Title'); if(title) r.name=title;
    r.designer=metaVal(head,'Designer'); r.license=metaVal(head,'License'); r.modelDesc=stripHtml(metaVal(head,'Description')).slice(0,1500); }
  // material
  const ps=zip.file('Metadata/project_settings.config');
  if(ps){ try{ const j=JSON.parse(await ps.async('string')); const t=(j.filament_type||[])[0]; if(t) r.material=t; const d=parseFloat((j.filament_density||[])[0]); if(d>0) r.density=d; }catch(e){} }
  // fatiamento por placa
  const plates=[]; const si=zip.file('Metadata/slice_info.config');
  if(si){ const doc=new DOMParser().parseFromString(await si.async('string'),'application/xml');
    doc.querySelectorAll('plate').forEach(p=>{ const md=k=>{const el=p.querySelector('metadata[key="'+k+'"]'); return el?el.getAttribute('value'):null;};
      const fil=[...p.querySelectorAll('filament')].map(f=>({type:f.getAttribute('type'),color:f.getAttribute('color'),g:+f.getAttribute('used_g')||0}));
      const time=+md('prediction')||0, weight=+md('weight')||fil.reduce((a,f)=>a+f.g,0);
      if(time||weight) plates.push({idx:md('index')||String(plates.length+1), sec:time, g:weight, colors:fil.map(f=>f.color).filter(Boolean)}); }); }
  if(!plates.length){ for(const n of names.filter(n=>/Metadata\/plate_\d+\.gcode$/i.test(n))){ const g=parseGcode(await zip.file(n).async('string')); if(g.sec||g.g) plates.push({idx:n.match(/plate_(\d+)/)[1],sec:g.sec,g:g.g,colors:[]}); } }
  // malha
  const arrs=[]; for(const n of names.filter(n=>/\.model$/i.test(n))) arrs.push(...parse3mfMeshes(await zip.file(n).async('string')));
  const mesh = arrs.length ? meshStats(arrs) : null; if(mesh) r.dims=mesh.bbox;
  if(plates.length){ r.plates=plates; r.grams=+plates.reduce((a,p)=>a+p.g,0).toFixed(1); r.minutes=Math.round(plates.reduce((a,p)=>a+p.sec,0)/60); r.kind='exact'; r.colors=[...new Set(plates.flatMap(p=>p.colors))]; }

  const imgName = ['Metadata/plate_1.png','Auxiliaries/.thumbnails/thumbnail_3mf.png','Metadata/thumbnail.png','Auxiliaries/.thumbnails/thumbnail_middle.png'].find(n=>zip.file(n))

  return r;
}

async function shrinkImage(blob, max=900){

    const bmp = await createImageBitmap(blob); const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));

}

      field('eMargin','Lucro desejado',p.margin,{suf:'% do preço',step:'1',ph:String(S.margin)})+
      '<div class="sect">Anúncio</div>'+
      '<div class="field full"><label for="eAdTitle">Título do anúncio</label><div class="in"><input id="eAdTitle" type="text" maxlength="60" value="'+esc(p.adTitle)+'" placeholder="Até 60 caracteres, palavras que o cliente busca"><span id="eAdCount">'+String(p.adTitle||'').length+'/60</span></div></div>'+
      '<div class="field full"><label for="eDesc">Descrição</label><textarea class="ta" id="eDesc" placeholder="O que é, tamanho, material, cores, prazo, cuidados">'+esc(p.description)+'</textarea>'+
        '<div class="actions">'+(sample?'<button class="btn ghost sm" type="button" id="eAI">Gerar título e descrição com IA</button>':'')+'<button class="btn plain sm" type="button" id="eTpl">Usar modelo de texto</button><span class="status" id="eAIStatus"></span></div></div>'+
    '</div>'+
    '<div class="live" id="eLive"></div>'+
    '<div class="actions" style="justify-content:space-between">'+(p._isNew?'<span></span>':'<button class="btn danger" type="button" id="eDel">Excluir produto</button>')+'<div class="actions"><button class="btn plain" type="button" id="eCancel">Cancelar</button><button class="btn" type="button" id="eSave">Salvar produto</button></div></div>'+
  '</div>';
  wireEditor(); updateLive();
}
function readEditorFields(){
  const p=openEditor; if(!p) return;
  p.name=$('eName').value.trim(); p.catalogId=$('eCat').value; p.grams=$('eGrams').value===''?'':num($('eGrams').value);
  const hv=$('eH').value, mv=$('eM').value; p.minutes = (hv===''&&mv==='') ? '' : num(hv)*60+num(mv);
  p.pieces=Math.max(1,Math.round(num($('ePieces').value)||1)); p.material=$('eMaterial').value.trim(); p.colorText=$('eColor').value.trim();
  p.filPrice=$('eFil').value===''?'':num($('eFil').value);
  p.laborMin=$('eLabor').value===''?'':num($('eLabor').value); p.pack=$('ePack').value===''?'':num($('ePack').value); p.extras=num($('eExtras').value); p.margin=$('eMargin').value===''?'':num($('eMargin').value);
  p.adTitle=$('eAdTitle').value.trim(); p.description=$('eDesc').value;
}
function updateLive(){
  const p=openEditor; if(!p) return; readEditorFields(); $('eAdCount').textContent=(p.adTitle||'').length+'/60';
  const c=costOf(p), pr=pricesFor(p), g=k=>pr.find(x=>x.ch.key===k);
  const v=o=>o&&!o.bad?BRL(o.price):'—';
  $('eLive').innerHTML='<div class="lv"><div><small>Custo/peça</small><b>'+BRL(c.total)+'</b></div><div><small>Pix</small><b>'+v(g('pix'))+'</b></div><div><small>ML Clássico</small><b>'+v(g('ml1'))+'</b></div><div><small>Shopee</small><b>'+v(g('sh'))+'</b></div><div><small>TikTok</small><b>'+v(g('tk'))+'</b></div></div>';
}
function templateText(p){
  const dims = p.dims&&p.dims.length===3 ? Math.round(Math.max(p.dims[0],p.dims[1]))/10+' cm de largura e '+Math.round(p.dims[2])/10+' cm de altura' : 'consulte as medidas';
  return p.name+' impresso em 3D, feito sob encomenda com acabamento caprichado.\n\nDETALHES\n- Material: '+(p.material||'PLA')+', plástico biodegradável\n- Tamanho: '+dims+'\n- Cores: '+(p.colorText||'consulte as opções')+'\n- Peça leve e resistente, pronta para decorar ou presentear\n\nPRAZO\nProdução em até 3 dias úteis, mais o prazo de entrega.\n\nIMPORTANTE\nCada peça é produzida sob encomenda, por isso pode haver pequenas marcas naturais da impressão 3D. Não deixe exposta ao sol forte ou dentro de carros quentes.';
}
function wireEditor(){
  const p=openEditor;
  $('eClose').onclick=closeEditor; $('eCancel').onclick=closeEditor;
  const drop=$('eDrop'), fi=$('eFile');
  drop.onclick=()=>fi.click(); drop.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fi.click(); } };
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
  drop.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f) loadFileIntoEditor(f); });
  fi.onchange=()=>{ if(fi.files[0]) loadFileIntoEditor(fi.files[0]); fi.value=''; };
  $('ePhoto').onclick=()=>$('ePhotoFile').click();
  $('ePhotoFile').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; readEditorFields(); openEditor._newImage=await shrinkImage(f); openEditor._userPhoto=true; renderEditor(); };
  $('editor').querySelectorAll('input,select,textarea').forEach(x=>{ if(x.type!=='file' && !x.dataset.plate) x.addEventListener('input',updateLive); });
  $('editor').querySelectorAll('[data-plate]').forEach(cb=>cb.onchange=()=>{ readEditorFields(); const pl=p.plates[+cb.dataset.plate]; pl.off=!cb.checked; const on=p.plates.filter(x=>!x.off); p.grams=+on.reduce((a,x)=>a+(+x.g),0).toFixed(1); p.minutes=Math.round(on.reduce((a,x)=>a+x.sec,0)/60); renderEditor(); });
  $('eTpl').onclick=()=>{ readEditorFields(); if(!p.adTitle) p.adTitle=(p.name+' Impresso 3D').slice(0,60); p.description=templateText(p); renderEditor(); };
  const ai=$('eAI'); if(ai) ai.onclick=async()=>{
    readEditorFields(); if(!p.name){ $('eAIStatus').textContent='Escreva o nome primeiro.'; return; }
    ai.disabled=true; $('eAIStatus').textContent='Escrevendo…';
    const cat=catalogs.find(c=>c.id===p.catalogId);
    const dims=p.dims&&p.dims.length===3?p.dims.map(v=>Math.round(v)).join(' x ')+' mm':'não informado';
    const prompt='Você escreve anúncios de produtos impressos em 3D para Mercado Livre, Shopee e TikTok Shop no Brasil. Escreva em português do Brasil.\n\nProduto: '+p.name+'\nCatálogo/tema: '+(cat?cat.name:'geral')+'\nMaterial: '+(p.material||'PLA')+'\nCores: '+(p.colorText||'a escolher')+'\nTamanho (largura x profundidade x altura): '+dims+'\nDescrição original do modelo (pode estar em inglês, use só como referência): '+(p.modelDesc||'nenhuma').slice(0,1200)+'\n\nRegras: título com no máximo 60 caracteres, com as palavras que o comprador digita na busca, sem emojis, sem marcas registradas ou personagens licenciados, sem promessas falsas. Descrição em texto simples (sem markdown), com: o que é e para que serve, seção DETALHES com material, tamanho e cores, seção PRAZO dizendo produção em até 3 dias úteis, seção IMPORTANTE avisando que é feito sob encomenda em impressão 3D e pode ter pequenas marcas de camada. Entre 600 e 1200 caracteres.\n\nResponda só com JSON: {"titulo": "...", "descricao": "..."}';
    try{ const r=await sample.json(prompt,{modelTier:'quick'}); if(r&&r.titulo){ p.adTitle=String(r.titulo).slice(0,60); p.description=String(r.descricao||''); renderEditor(); toast('Texto gerado. Revise antes de salvar.'); } else throw {code:'vazio'}; }
    catch(e){ ai.disabled=false; $('eAIStatus').textContent = e&&e.code==='not_granted' ? 'Permissão negada para usar a IA.' : e&&e.code==='rate_limited' ? 'Muitas solicitações. Tente em instantes.' : 'Não consegui gerar agora.'; }
  };
  $('eSave').onclick=async()=>{
    readEditorFields(); const st=$('eAIStatus');
    if(!p.name){ $('eName').focus(); toast('Dê um nome ao produto'); return; }
    if(p.grams===''||p.minutes===''){ toast('Preencha o peso e o tempo, ou solte o arquivo'); return; }
    const btn=$('eSave'); btn.disabled=true; btn.textContent='Salvando…';
    try{
      if(p._newImage){
        if(assets){ const up=await assets.upload(p._newImage,{type:p._newImage.type||'image/webp'}); const old=p.imageId; p.imageId=up.id; delete p.imageData; if(old&&old!==up.id&&!products.some(x=>x.id!==p.id&&x.imageId===old)){ try{ await assets.delete(old);}catch(e){} } }
        else { p.imageData = await blobToDataUrl(await shrinkImage(p._newImage,420)); }
      }
      const clean={...p}; delete clean._isNew; delete clean._newImage; delete clean._userPhoto; if(clean.fileName||p._newImage) clean.example=false;
      await saveProduct(clean); const id=clean.id; closeEditor(); openDetail(id); toast('Produto salvo');
    }catch(e){ btn.disabled=false; btn.textContent='Salvar produto'; toast(e&&e.code==='quota_exceeded'||e&&e.code==='quota_or_state'?'Espaço do catálogo cheio':'Não consegui salvar. Tente de novo.'); }
  };
  const del=$('eDel'); if(del) del.onclick=async()=>{ if(!del.classList.contains('armed')){ del.classList.add('armed'); del.textContent='Confirmar: excluir de vez'; return; } const orig=products.find(x=>x.id===p.id); try{ await removeProduct(orig||p); closeEditor(); closeDetail(); toast('Produto excluído'); }catch(e){ toast('Não consegui excluir'); } };
}
async function loadFileIntoEditor(file){
  readEditorFields(); const st=$('eFileStatus'); st.textContent='Lendo '+file.name+'…';
  try{
    const r=await readModelFile(file); const p=openEditor;
    if(!p.name || p._isNew) p.name=r.name;
    Object.assign(p,{fileName:r.fileName, grams:r.grams, minutes:r.minutes, kind:r.kind, dims:r.dims||null, plates:r.plates||null, designer:r.designer||'', license:r.license||'', modelDesc:r.modelDesc||''});
    if(r.material) p.material=r.material; if(r.colors&&r.colors.length) p.colors=r.colors;
    if(r.imageBlob && !p._userPhoto && (p._isNew || p.example || (!p.imageId && !p.imageData))) p._newImage = await shrinkImage(r.imageBlob);
    renderEditor(); toast(r.kind==='exact'?'Arquivo lido com dados do fatiador':'Arquivo lido: peso e tempo estimados');
  }catch(e){ st.innerHTML='<span class="err">'+esc(e.message||String(e))+'</span> Você pode digitar peso e tempo à mão.'; }
}

/* ================= configurações ================= */
function openSettings(){ renderSettings(); $('ovSettings').hidden=false; document.body.style.overflow='hidden'; }
function closeSettings(){ $('ovSettings').hidden=true; if($('ovDetail').hidden&&$('ovEdit').hidden) document.body.style.overflow=''; }
function sf(id,label,opts={}){ return field('s_'+id,label,S[id],opts); }
function renderSettings(){
  const el=$('settings'); const ro=!canEdit && !STATIC;
  el.innerHTML='<div class="sheet-head"><h2 id="sTitle">Custos e taxas</h2><button class="x" id="sClose" type="button" aria-label="Fechar">×</button></div><div class="sheet-body">'+
  '<p class="note" style="margin:0">Valem para todos os produtos. Mudou aqui, todos os preços do catálogo se atualizam.'+(STATIC?' Use para simular: os ajustes ficam só neste navegador.':ro?' Você está vendo em modo leitura.':'')+'</p>'+
  '<div class="panel"><div class="fields">'+
    '<div class="sect">Filamento e impressora</div>'+
    sf('filPrice','Preço do filamento',{pre:'R$',suf:'/kg',step:'0.01'})+sf('fail','Taxa de falha',{suf:'%',step:'1'})+
    sf('watts','Consumo médio da impressora',{suf:'W',step:'1',note:'A1 ~95 · P1S ~130 · X1C ~145 · H2D ~200'})+sf('kwh','Tarifa de energia',{pre:'R$',suf:'/kWh',step:'0.01'})+
    sf('printerPrice','Valor da impressora',{pre:'R$',step:'10'})+sf('lifeH','Vida útil',{suf:'h',step:'100'})+
    sf('maint','Manutenção',{pre:'R$',suf:'/h',step:'0.05'})+
    '<div class="sect">Por peça</div>'+
    sf('laborMin','Acabamento e embalagem',{suf:'min',step:'1'})+sf('laborRate','Sua hora de trabalho',{pre:'R$',suf:'/h',step:'1'})+
    sf('pack','Embalagem',{pre:'R$',step:'0.1'})+
    '<div class="sect">Preço</div>'+
    sf('margin','Lucro desejado',{suf:'% do preço',step:'1'})+sf('tax','Imposto sobre a venda',{suf:'%',step:'0.1',note:'MEI: 0 · Simples: ~4–6%'})+
    sf('pixMargin','Lucro na venda direta',{suf:'%',step:'1',note:'Vazio = mesmo lucro'})+sf('pixFee','Tarifa do banco no Pix',{suf:'%',step:'0.01'})+
  '</div></div>'+
  '<div class="panel"><div class="fields">'+
    '<div class="sect">Mercado Livre</div>'+
    sf('mlClassico','Clássico',{suf:'%',step:'0.5'})+sf('mlPremium','Premium',{suf:'%',step:'0.5'})+
    sf('mlCustoOp','Custo por unidade abaixo de R$ 79',{pre:'R$',step:'0.05'})+sf('mlFrete','Frete grátis pago por você (≥ R$ 79)',{pre:'R$',step:'0.5'})+
    '<div class="sect">Shopee</div>'+
    '<div class="field full" style="overflow-x:auto"><table class="tiers"><thead><tr><th>Faixa</th><th>Comissão</th><th>Tarifa fixa</th></tr></thead><tbody>'+
      [['até R$ 79,99',1],['R$ 80 a 99,99',2],['R$ 100 a 199,99',3],['R$ 200 ou mais',4]].map(([l,i])=>'<tr><td>'+l+'</td><td><div class="in"><input id="s_sh'+i+'p" type="number" step="0.5" value="'+esc(S['sh'+i+'p'])+'"><span>%</span></div></td><td><div class="in"><span>R$</span><input id="s_sh'+i+'f" type="number" step="0.5" value="'+esc(S['sh'+i+'f'])+'"></div></td></tr>').join('')+
    '</tbody></table></div>'+
    '<label class="check field full"><input type="checkbox" id="s_shCpf"'+(S.shCpf?' checked':'')+'> Vendo como CPF com mais de 450 pedidos em 90 dias (+ R$ 3 por item)</label>'+
    '<div class="sect">TikTok Shop</div>'+
    sf('tkLowP','Comissão abaixo de R$ 50',{suf:'%',step:'0.5'})+sf('tkLowF','Tarifa abaixo de R$ 50',{pre:'R$',step:'0.5'})+
    sf('tkHighP','Comissão a partir de R$ 50',{suf:'%',step:'0.5'})+sf('tkHighF','Tarifa a partir de R$ 50',{pre:'R$',step:'0.5'})+
    sf('tkFrete','Programa de frete',{suf:'%',step:'0.5'})+sf('tkAfil','Comissão de afiliados',{suf:'%',step:'0.5'})+
  '</div><p class="note">Taxas conferidas em novembro de 2026. Confira no painel de cada marketplace.</p></div>'+
  '<div class="panel"><div class="fields">'+
    '<div class="sect">Estimativa para arquivos STL (sem fatiamento)</div>'+
    sf('infill','Preenchimento',{suf:'%',step:'1'})+sf('shell','Paredes e topo',{suf:'mm',step:'0.05'})+sf('density','Densidade',{suf:'g/cm³',step:'0.01'})+
    sf('speed','Ritmo de impressão',{suf:'g/h',step:'1'})+sf('overhead','Aquecimento e calibração',{suf:'min',step:'1'})+
  '</div></div>'+
  (canEdit||STATIC?'<div class="actions"><button class="btn plain" type="button" id="sReset">Restaurar padrões</button></div>':'')+
  '</div>';
  $('sClose').onclick=closeSettings;
  el.querySelectorAll('input').forEach(inp=>{ if(ro){ inp.disabled=true; return; } inp.addEventListener('input',()=>{ const k=inp.id.slice(2); S[k] = inp.type==='checkbox' ? inp.checked : (inp.value===''&&k==='pixMargin' ? '' : num(inp.value)); render(); saveSettingsSoon(); }); });
  const r=$('sReset'); if(r) r.onclick=()=>{ S={...DEFAULTS, ...((window.CATALOGO&&CATALOGO.config)||{})}; renderSettings(); render(); saveSettingsSoon(); toast('Padrões restaurados'); };
}

/* ================= eventos gerais ================= */
$('btnNew').onclick=()=>openEditorFor(null);
$('btnSettings').onclick=openSettings;
[['ovDetail',closeDetail],['ovEdit',closeEditor],['ovSettings',closeSettings]].forEach(([id,fn])=>$(id).addEventListener('click',e=>{ if(e.target.id===id) fn(); }));
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if(!$('ovEdit').hidden) closeEditor(); else if(!$('ovSettings').hidden) closeSettings(); else if(!$('ovDetail').hidden) closeDetail(); });
window.addEventListener('dragover',e=>e.preventDefault()); window.addEventListener('drop',e=>e.preventDefault());
boot();
</script>
